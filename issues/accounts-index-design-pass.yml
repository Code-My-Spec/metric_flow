id: "accounts-index-design-pass"
kind: "issue"
title: The accounts list page doesn't follow the Anderson BI design
text: |-
  Fault: the accounts list page (lib/metric_flow_web/live/account_live/index.ex) doesn't follow the Anderson BI design that design-system-2 set up.

  Do a design pass on that page file. Follow the "Design pass" section of DESIGN.md: every step, before and after screenshots at 390px and 1440px on the seeded data (priv/repo/seeds.exs) in the evidence folder, and the trailer Design-Pass: lib/metric_flow_web/live/account_live/index.ex. Screenshot as the seeded agency owner (joel@example.com), who belongs to several accounts.

  Who it is for: an agency owner who reports to and resells to clients. Read .code_my_spec/personas/agency-owner-reporting-reseller/summary.md first.

  What the page must do:
  - Show one row per account, with its type and the user's role on it.
  - Make switching to an account the obvious action on each row.

  Rules: keep every id and data-* attribute. Grep test/ (including test/spex/) for any you touch, and run those files. Change only this page, plus a shared component if a pattern repeats. Nothing scrolls sideways at 390px. Use only theme tokens: no hard-coded colours or radii.

  Evidence: Before your last commit, run ls on the evidence folder and confirm the four PNGs exist (before-390, before-1440, after-390, after-1440), git add them, and list them in the evidence README. The review fails without them.

  How it will be checked:
  - The full suite and mix spex pass.
  - Each account appears as one row showing its type and the user's role.
  - Switching account is the obvious action on each row, and switching still works.
  - Nothing scrolls sideways at 390px.
  - The evidence folder holds the four committed PNGs (before-390, before-1440, after-390, after-1440), listed in its README.
  - The commit carries the trailer Design-Pass: lib/metric_flow_web/live/account_live/index.ex.
criteria: []
