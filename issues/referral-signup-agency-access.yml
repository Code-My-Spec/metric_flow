id: "referral-signup-agency-access"
kind: "issue"
title: Clients who sign up through an agency referral link are invisible to the agency
text: |-
  Symptom: after a client registers at /users/register?ref=<agency token>, the agency's users do not see the client account in list_accounts (MetricFlow.Onboarding.Tools, :mcp mode) and cannot call save_sync_selection for it.

  Cause: MetricFlow.Agencies.associate_referred_account/2 creates the agency grant at :read_only. It also never adds the agency's team members to the client account. grant_client_account_access/5 does add them, by calling propagate_client_access_to_team.

  Fix rule: a referral signup grants the agency :account_manager on the client account. It also adds every agency team member to the client account as :account_manager.

  How it will be checked:
  - Joel owns an agency. Client Jane registers through Joel's referral link with account name "Acme". Joel's list_accounts then includes Acme with can_change_setup true, and Joel can save_sync_selection for Acme. Every other agency team member also gets :account_manager membership on Acme.
  - A registration with an expired or forged ref token creates no agency grant and no membership, and the registration still succeeds.
criteria: []
