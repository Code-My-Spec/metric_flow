id: "account-settings-design-pass"
kind: "issue"
title: The account settings page doesn't follow the Anderson BI design
text: |-
  Fault: the account settings page (lib/metric_flow_web/live/account_live/settings.ex, plus the section components it renders from lib/metric_flow_web/live/agency_live/settings.ex and lib/metric_flow_web/live/agency_live/logo_upload.ex) doesn't follow the Anderson BI design that design-system-2 set up.

  Do a design pass on that page file and the two section components it renders. Follow the "Design pass" section of DESIGN.md: every step, before and after screenshots at 390px and 1440px on the seeded data (priv/repo/seeds.exs) in the evidence folder, and the trailer Design-Pass: lib/metric_flow_web/live/account_live/settings.ex. Screenshot as the seeded agency owner (joel@example.com) on the agency account "Anderson the Fish", so the agency sections show.

  Who it is for: an agency owner who reports to and resells to clients. Read .code_my_spec/personas/agency-owner-reporting-reseller/summary.md first.

  What the page must do:
  - Show each section as its own card: account, agency access (granting access by slug), and branding.
  - Set dangerous actions apart from the rest, visibly separated from everyday settings.

  Rules: keep every id and data-* attribute, including data-role="agency-logo" and data-role="default-logo". Grep test/ (including test/spex/) for any you touch, and run those files. Change only this page and the two section components it renders, plus a shared component if a pattern repeats. Nothing scrolls sideways at 390px. Use only theme tokens: no hard-coded colours or radii.

  Evidence: Before your last commit, run ls on the evidence folder and confirm the four PNGs exist (before-390, before-1440, after-390, after-1440), git add them, and list them in the evidence README. The review fails without them.

  How it will be checked:
  - The full suite and mix spex pass.
  - The account, agency access and branding sections each appear as a separate card; granting agency access by slug and uploading a logo still work.
  - Dangerous actions are set apart from the other sections.
  - Nothing scrolls sideways at 390px.
  - The evidence folder holds the four committed PNGs (before-390, before-1440, after-390, after-1440), listed in its README.
  - The commit carries the trailer Design-Pass: lib/metric_flow_web/live/account_live/settings.ex.
