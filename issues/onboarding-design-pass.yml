id: "onboarding-design-pass"
kind: "issue"
title: The onboarding page doesn't follow the Anderson BI design
text: |-
  Fault: the onboarding page (lib/metric_flow_web/live/onboarding_live.ex) doesn't follow the Anderson BI design that design-system-2 set up.

  Do a design pass on that page file. Follow the "Design pass" section of DESIGN.md: every step, before and after screenshots at 390px and 1440px on the seeded data (priv/repo/seeds.exs) in the evidence folder, and the trailer Design-Pass: lib/metric_flow_web/live/onboarding_live.ex. Take the screenshots as the seeded retail client (Anderson Retail Co.).

  Who it is for: the referred client of an agency. Read .code_my_spec/personas/agency-client-referred-customer/summary.md first.

  What the page must do:
  - Match the step style of the onboarding connect page (lib/metric_flow_web/live/onboarding_live/connect.ex, already redesigned on main): a short step-by-step flow that shows which steps are done and which step is next.
  - Give each step exactly one primary action.

  Rules: keep every id and data-* attribute. Grep test/ (including test/spex/) for any you touch, and run those files. Change only this page, plus a shared component if a pattern repeats (for example, reuse the step component from onboarding-connect if one exists). Nothing scrolls sideways at 390px. Use only theme tokens: no hard-coded colours or radii.

  Evidence: Before your last commit, run ls on the evidence folder and confirm the four PNGs exist (before-390, before-1440, after-390, after-1440), git add them, and list them in the evidence README. The review fails without them.

  How it will be checked:
  - The full suite and mix spex pass.
  - The page shows onboarding as steps in the same style as the onboarding connect page, with done steps and the next step clearly marked.
  - Each step has exactly one primary action, and onboarding still works.
  - Nothing scrolls sideways at 390px.
  - The evidence folder holds the four committed PNGs (before-390, before-1440, after-390, after-1440), listed in its README.
  - The commit carries the trailer Design-Pass: lib/metric_flow_web/live/onboarding_live.ex.
criteria: []
