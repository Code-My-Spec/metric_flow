id: "invite-client-tool-stuck-at-work"
kind: "issue"
title: "Story invite-client-tool stopped at work: coder sent the same tree and note three times"
text: |-
  The loop stopped story invite-client-tool at the work step (coder) at 2026-11-19T18:07:07Z, at head 6b03385c677251b4a5aad04e37ea35351fa495ef, after 5 commits.

  Stop reason, verbatim: "waiting on its owner: sent to the coder a third time with the same tree and note".

  Failing check: the spex run (status failed), run dir /Users/johndavenport/cms-dogfood/metric_flow-prod/.git/workflow/analysis/6b03385c677251b4a5aad04e37ea35351fa495ef.

  The note handed to the coder is the raw spex output. It is cut off mid-stream, before any failure summary, so the coder never sees which spec failed. Its visible content is passing-test dots plus log lines like:
  [warning] [OAuth] strategy.callback result keys=[:user, :token], user_data_keys=["email", "email_verified", "name", "sub"]
  [error] SyncWorker sync failed integration_id=15547 user_id=73556 reason=:youtube_sync_failed
  [error] SyncWorker sync failed integration_id=15550 user_id=73559 reason=:youtube_sync_failed

  Wanted: when a spex run fails, the note given to the coder includes the failing spec names and their failure messages, not a truncated stream of log noise. The coder should not be sent the same tree and the same note again without new information.

  How it will be checked:
  - When a spex run fails, the coder's note names each failing spec and gives its assertion or error message, even when the run's log output is long.
  - The loop does not send a work back to the coder with the same tree and the same note it already sent.
criteria: []
