title: Assistant tool invite_client sends a client the agency signup link
workflow: Agency client onboarding
story: |-
  As an agency user, I want the assistant to invite a client, so that onboarding starts from one chat message.

  Where: add a new tool, invite_client, to MetricFlow.Onboarding.Tools (lib/metric_flow/onboarding/tools.ex). It exists only in :mcp mode, alongside list_accounts, and takes no account_id. Its arguments are email (optional) and agency_account_id (optional when the user belongs to exactly one agency account). The link is Endpoint.url() <> "/users/register?ref=" <> token, where the token comes from Agencies.generate_referral_link/2, which requires admin or owner on the agency. The tool description must tell the agent this: the client appears in list_accounts once they sign up with an account name; then use get_connect_link with that account_id.
rules:
  - rule: invite_client returns the agency's signup link, and with an email it also emails that link to the client, naming the agency
    scenarios:
      - happy: "Joel owns one agency and calls invite_client with email jane@acme.com. He gets {:ok, url containing /users/register?ref=, emailed: true}, and exactly one email goes to jane@acme.com containing that url and naming the agency."
      - happy: Joel calls invite_client with no email. He gets the url back, and no email is sent.
  - rule: Only an admin or owner of exactly one identifiable agency account can invite
    scenarios:
      - fails: A user who only belongs to client accounts calls invite_client and gets the error "You are not on an agency account."
      - fails: A read_only member of the agency calls invite_client and gets a not-authorized error. No link is generated and no email is sent.
      - fails: A user on two agency accounts calls invite_client without agency_account_id and gets an error asking which agency account to use.
