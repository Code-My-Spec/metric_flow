# Kamal config for metric_flow UAT on the Hetzner UAT box (Nuremberg ARM).
# Run with: scripts/deploy-uat
#
# Same shape as deploy.yml; differs in host, alias, and arch. Service name
# matches deploy.yml so the multi-arch image labels resolve.

service: metric-flow
image: code-my-spec/metric_flow

servers:
  web:
    hosts:
      - 46.225.105.88
    options:
      network: db_net           # pre-attach so app can reach infra-postgres-1 at start
    proxy:                      # role-level override of deploy.yml's `proxy: false`
      ssl: true
      host: uat.metric-flow.app
      app_port: 4000

registry:
  server: ghcr.io
  username: johns10
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64
  local: true

# Container fetches its own secrets from /metric_flow/uat/* in SSM at
# boot via MetricFlow.Secrets.load!/1 (config/runtime.exs). The only env
# Kamal carries is AWS bootstrap creds + APP_ENV.
env:
  clear:
    APP_ENV: uat
    AWS_REGION: us-east-1
  secret:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

ssh:
  user: root
