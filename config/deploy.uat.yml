# Kamal config for metric_flow uat on the Hetzner UAT box (Nuremberg ARM).
# Deployed by CodeMySpec (bin/deploy migrate|swap uat).
#
# The container decrypts envs/uat.enc.env at boot via rel/overlays/bin/boot;
# the only secret kamal carries is SOPS_AGE_KEY.

service: metric-flow
image: metric-flow

servers:
  web:
    hosts:
      - uat.metric-flow.app
    options:
      network: db_net           # reach cms-postgres at start
    proxy:
      ssl: true
      host: uat.metric-flow.app
      app_port: 4000
      healthcheck:
        path: /up

registry:
  server: 10.1.0.2:5000
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64
  local: true

env:
  clear:
    APP_ENV: uat
    PORT: "4000"
    # config/runtime.exs falls back to "example.com" without this — every
    # URL the app generates (redirects, emails, OAuth callbacks) was built
    # against a host that was never this app's own.
    PHX_HOST: uat.metric-flow.app
    CODEMYSPEC_URL: https://dev.codemyspec.com
    CODEMYSPEC_WIDGET_URL: wss://dev.codemyspec.com/widget
    # Traces to the OTel collector on db_net, which writes to ClickHouse.
    # service.version comes from KAMAL_VERSION (config/runtime.exs).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://cms-otel-collector:4318
    OTEL_SERVICE_NAME: metric_flow
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=uat
  secret:
    - SOPS_AGE_KEY

ssh:
  user: root
<% if ENV["CMS_SSH_KEY_PATH"] %>
  keys: ["<%= ENV["CMS_SSH_KEY_PATH"] %>"]
  keys_only: true
  log_level: debug
<% end %>
