# Kamal config for metric_flow PROD on the Hetzner prod box (Ashburn x86).
# Run with: scripts/deploy
#
# Notes:
# - kamal-proxy serves traffic on :80/:443 directly (Caddy retired 2026-05-07).
# - db_net is pre-attached so the container can reach infra-postgres-1 at start.
# - App secrets are fetched at container boot from AWS SSM
#   (`/metric_flow/prod/*`) by MetricFlow.Secrets.load!/1 in
#   config/runtime.exs. Kamal carries only the AWS bootstrap credentials
#   listed under env.secret below — never app secrets.

service: metric-flow
image: code-my-spec/metric_flow

servers:
  web:
    hosts:
      - 178.156.143.212
    options:
      network: db_net

proxy:
  ssl: true
  host: metric-flow.app
  app_port: 4000

registry:
  server: ghcr.io
  username: johns10
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  local: true

# Container fetches its own secrets from /metric_flow/prod/* in SSM at
# boot via MetricFlow.Secrets.load!/1 (config/runtime.exs). The only env
# Kamal carries is AWS bootstrap creds + APP_ENV.
env:
  clear:
    APP_ENV: prod
    AWS_REGION: us-east-1
  secret:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

ssh:
  user: root
