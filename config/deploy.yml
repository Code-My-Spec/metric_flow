# Kamal config for metric_flow prod on the Hetzner prod box (Ashburn x86).
# Deployed by CodeMySpec (bin/deploy migrate|swap prod).
#
# The container decrypts envs/prod.enc.env at boot via rel/overlays/bin/boot;
# the only secret kamal carries is SOPS_AGE_KEY.

service: metric-flow
image: metric-flow

servers:
  web:
    hosts:
      - metric-flow.app
    options:
      network: db_net           # reach cms-postgres at start
    proxy:
      ssl: true
      host: metric-flow.app
      app_port: 4000
      healthcheck:
        path: /up

registry:
  server: 10.0.0.2:5000
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  local: true

env:
  clear:
    APP_ENV: prod
    PORT: "4000"
    # config/runtime.exs falls back to "example.com" without this — every
    # URL the app generates (redirects, emails, OAuth callbacks) was built
    # against a host that was never this app's own.
    PHX_HOST: metric-flow.app
  secret:
    - SOPS_AGE_KEY

ssh:
  user: root
<% if ENV["CMS_SSH_KEY_PATH"] %>
  keys: ["<%= ENV["CMS_SSH_KEY_PATH"] %>"]
  keys_only: true
  log_level: debug
<% end %>
